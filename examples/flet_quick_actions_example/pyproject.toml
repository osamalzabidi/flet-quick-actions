[project]
name = "flet-quick-actions-example"
version = "0.1.0"
description = "Example app for flet-quick-actions: exercises every quick action feature on Android and IOS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet",
    "flet-quick-actions",
]

# [tool.uv.sources]
# flet-quick-actions = { path = "../..", editable = true }

[tool.flet]
org = "flet.app"
product = "Flet Quick Actions Example"
build_number = 1

[tool.flet.app]
path = "src"

[dependency-groups]
dev = [
    "flet-cli",
]