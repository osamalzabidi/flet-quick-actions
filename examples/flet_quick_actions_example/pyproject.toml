[project]
name = "flet-quick-actions-example"
version = "0.1.0"
description = "Example app for flet-quick-actions: exercises every quick action feature on Android and IOS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet-quick-actions",
    "flet>=1.0.5",
]

[tool.uv]
find-links = ["../../wheels"]

[tool.flet.dev_packages]
flet-quick-actions = "../.."

[tool.uv.sources]
flet-quick-actions = { path = "../..", editable = true }

[tool.flet]
org = "flet.app"
product = "quickactions"
build_number = 1

[tool.flet.app]
path = "src"

[dependency-groups]
dev = [
    "flet-cli",
]