[project]
name = "flet-quick-actions"
version = "0.1.0"
description = "Flet Quick Actions service."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Osama Mohammed", email = "osamalzabidi@gmail.com" }
]
keywords = ["flet", "quick", "actions", "android", "ios", "shortcut"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "flet>=1.1.0",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://github.com/osamalzabidi/flet-quick-actions"
Documentation = "https://github.com/osamalzabidi/flet-quick-actions"
Repository = "https://github.com/osamalzabidi/flet-quick-actions"
Issues = "https://github.com/osamalzabidi/flet-quick-actions/issues"

[tool.setuptools.package-data]
"flutter.flet_quick_actions" = ["**/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
