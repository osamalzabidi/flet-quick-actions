[project]
name = "flet-quick-actions"
version = "0.1.0"
description = "Flet Quick Actions service."
readme = "README.md"
authors = [
    { name = "Osama Mohammed", email = "support.osamalzabidi@gmail.com" }
]
license = { text = "Apache License" }
requires-python = ">=3.10"
keywords = ["flet", "quick", "actions", "android", "ios", "shortcut"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "flet",
]

[project.urls]
Homepage = "https://github.com/osamalzabidi/flet-quick-actions"
Repository = "https://github.com/osamalzabidi/flet-quick-actions"
Issues = "https://github.com/osamalzabidi/flet-quick-actions/issues"

[tool.setuptools.package-data]
"flutter.flet_quick_actions" = ["pubspec.yaml", "lib/**"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# Match the flet core source style: Optional[...] and quoted forward
# references in control/event annotations.
ignore = ["UP045", "UP037"]