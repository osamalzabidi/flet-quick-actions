name: Build Android Example & Create Release

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "0.1.0"
      build_number:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '0.1.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '1' }}

# Prevent two dispatches from racing on the same tag.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Quality gate: formatting check (blocks every build).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system black
      - name: Black
        run: black --check --diff src examples

  # Android APK, split per ABI (arm64-v8a, armeabi-v7a, x86_64).
  build-apk:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show effective package-data
        run: |
          python - <<'EOF'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              cfg = tomllib.load(f)
          print('package-data:', cfg['tool']['setuptools']['package-data'])
          EOF

      - name: Clean stale build artefacts
        run: |
          rm -rf build/
          rm -rf src/*.egg-info/
          rm -rf /tmp/wheels/
          uv cache clean

      - name: Build extension wheel
        run: uv build --wheel --out-dir wheels/ .

      - name: Verify extension wheel contents
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob('wheels/*.whl')[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              for n in names:
                  if 'flutter' in n:
                      print(n)
              required = 'flutter/flet_quick_actions/lib/flet_quick_actions.dart'
              if required not in names:
                  sys.exit(f'❌ Missing from wheel: {required}')
              print(f'✅ {required} is in the wheel')
          EOF

      - name: Build Android APK
        working-directory: examples/flet_quick_actions_example
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
        run: |
          uv run flet build apk \
            --yes --project quickactions \
            --product "quickactions" \
            --org flet.app \
            --build-version ${{ env.BUILD_VERSION }} \
            --build-number ${{ env.BUILD_NUMBER }} \
            --split-per-abi -v

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: examples/flet_quick_actions_example/build/apk/*.apk
          if-no-files-found: error
          retention-days: 7

  # Runs ONLY after build-apk succeeds. Creates/updates the release
  # and attaches the freshly built APKs.
  create-release:
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=flet-quick-actions ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=true" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=false" >> $GITHUB_OUTPUT
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: apks

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: ${{ steps.tag_info.outputs.MAKE_LATEST }}
          fail_on_unmatched_files: true
          files: apks/*.apk
          body: |
            Automated Android example build for `flet-quick-actions`.

            - Version: `${{ env.BUILD_VERSION }}`
            - Build number: `${{ env.BUILD_NUMBER }}`
            - Commit: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# iOS is intentionally not built here — it needs Apple code-signing
# credentials, which are provisioned owner-side. Build with:
#   uv run flet build ipa --project quickactions --org flet.app ...
# on a machine with a configured signing identity.