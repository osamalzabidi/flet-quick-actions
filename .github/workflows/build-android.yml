name: Build Android Example & Create Release

on:
#   push:
#     tags: ["v*"]
#   pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "0.1.0"
      build_number:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '0.1.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '1' }}

jobs:
  # Quality gate: lint + tests (blocks every build).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies (incl. dev group)
        run: |
          uv pip install --system -e .
          uv pip install --system black
      - name: Black
        run: |
          black --check --diff src tests examples

  # Creates the release placeholder this workflow's jobs upload to.
  prepare-release:
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
      MAKE_LATEST: ${{ steps.tag_info.outputs.MAKE_LATEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=flet-quick-actions ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=true" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=false" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: ${{ steps.tag_info.outputs.MAKE_LATEST }}
          body: |
            Automated Android example build for `flet-quick-actions`.

            The example app exercises the full extension API on every
            platform. Android builds run the `flet-quick-actions-patch`
            step, which injects the scheduled-notification receivers and
            the core-library-desugaring flags.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Android APK, split per ABI, with the notification patcher.
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build extension wheel
        run: |
          uv run python .github/scripts/sync_versions.py
          uv build --wheel --out-dir wheels/ .
      - name: First flet build pass (desugaring failure tolerated)
        working-directory: examples/flet_quick_actions_example
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
        run: |
          set +e
          uv run flet build apk --yes --project quickactions \
            --product "Flet Quick Actions Example" --org flet.app \
            --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} \
            --split-per-abi -v
          echo "flet build exit $? - the patcher + gradle rebuild follow"
      - name: Patch the generated Android project
        working-directory: examples/flet_quick_actions_example
        run: |
          uv run flet-quick-actions-patch --project-root build/flutter \
            --foreground-service-type specialUse
      - name: Rebuild with gradle
        working-directory: examples/flet_quick_actions_example/build/flutter/android
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/examples/flet_quick_actions_example/build/site-packages
        run: ./gradlew assembleRelease -Psplit-per-abi=true
      - name: Stage APKs
        working-directory: examples/flet_quick_actions_example
        run: |
          rm -rf build/apk && mkdir -p build/apk
          find build/flutter -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build/apk/ \;
          ls -lh build/apk/
      - name: Upload to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: examples/flet_quick_actions_example/build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# iOS is intentionally not built here — it needs Apple code-signing
# credentials, which are provisioned owner-side. Build with:
#   uv run flet build ipa --project quickactions --org flet.app ...
# on a machine with a configured signing identity.